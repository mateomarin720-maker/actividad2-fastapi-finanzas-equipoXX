[tool.poetry]
name = "financial-api"
version = "0.1.0"
description = "API educativa de senales financieras con FastAPI, yfinance y Docker"
authors = ["Equipo XX <equipo@example.com>"]
readme = "README.md"
packages = [{include = "financial_api", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
yfinance = "^0.2.44"
pandas = "^2.2.0"
numpy = "^2.0.0"
scikit-learn = "^1.5.0"
joblib = "^1.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
httpx = "^0.27.0"
black = "^24.4.0"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
